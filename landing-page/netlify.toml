# Netlify config for the BillZap landing page.
# Publish directory: landing-page/

[build]
  publish = "dist"

# The blog, the studio and their API are Netlify functions. The static
# pages are still static — only the parts that need a database are not.
[functions]
  directory = "functions"
  node_bundler = "esbuild"

# ── Caching ────────────────────────────────────────────────────────
# The HTML must revalidate so a deploy is visible immediately. Fonts,
# images and icons are content-addressed by filename and never change
# under the same name, so they get a year and immutable.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The studio must never be indexed, cached or sent as a referrer —
# the path is half of what keeps it private.
[[headers]]
  for = "/s/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/privacy/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ───────────────────────────────────────────────
# The CSP is still an allowlist of exactly what the page uses, it is
# just no longer empty: Google Analytics and the Apps Script endpoint
# the download form posts to. Fonts, images, styles and everything
# else remain locked to self — there are no CDNs and no embeds.
# 'unsafe-inline' covers the inlined <style> and the one bootstrap
# <script>.
#
# Analytics needs three separate grants, which is easy to get wrong:
# script-src to load gtag.js, connect-src for the beacons it sends,
# and img-src because it still falls back to a pixel in some browsers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://script.google.com https://script.googleusercontent.com; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# llms.txt is read by crawlers that expect text/plain, not a download.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# ── Dynamic routes ─────────────────────────────────────────────────
# A rewrite (200), not a redirect: the address bar keeps /blog/<slug>
# and the crawler sees a real page at a real URL, which is the whole
# point of rendering it server-side.
[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/blog"
  status = 200

# Post images live in the database, not on disk, so they are served by
# the same function that renders the post. Without this rule the static
# site answers /media/<id> with a 404 and every cover image breaks.
[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/sitemap-blog.xml"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# The studio. /s/<secret>; every other /s/… is a 404 from the function
# itself, so this rule gives nothing away.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/studio"
  status = 200

[[redirects]]
  from = "/download"
  to = "/#download"
  status = 302

[[redirects]]
  from = "/features"
  to = "/#features"
  status = 302

[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 302

# The old case study is gone; send its traffic to the live page.
[[redirects]]
  from = "/case-study.html"
  to = "/"
  status = 301

# ── Inherited URLs ─────────────────────────────────────────────────
# The site this replaces was a Next.js build, and some of its URLs are
# indexed. A 301 to the page that now covers the same ground keeps the
# link equity and stops a person who clicks a search result landing on
# a 404.
#
# The /blog and /blog/* 301s that used to live here are gone: the blog
# is real now and is served by the function above. They only ever
# worked because they sat below the rewrites — first match wins — and
# reordering this file would have silently killed the blog.

# /privacy is a real page again (privacy/index.html), so it is not
# redirected — this only catches the un-slashed and .html spellings.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

# Earlier deploys published the whole landing-page folder, so the page
# templates, the build script and the Apps Script source were briefly
# reachable at these paths. They are no longer deployed at all; these
# send anything that got crawled in the meantime to the real page
# rather than to a 404.
[[redirects]]
  from = "/build/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/google-sheet/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
