name: Release (Android APK)

# One workflow → one public GitHub Release carrying the Android APK,
# as a direct download (no GitHub login, no unzip).
#
# The release used to publish five files — APK, AAB, .exe, .dmg and an
# unsigned .ipa. BillZap ships as an Android app; its own site says
# "Android 7.0 and above". Handing a shopkeeper who tapped "Download
# for Android" a page with a disk image, a Windows installer and an
# unsigned iOS package makes them pick, and four of the five choices
# are wrong. The release is the APK.
#
# Nothing is lost: macos-build.yml, windows-build.yml and ios-build.yml
# still build those platforms on demand and keep the binaries as
# workflow artifacts. They just no longer sit on the download page.
#
# The AAB comes off the release page too: it is a Play Console upload,
# not something an end user downloads. It is still built here and kept
# as a workflow artifact, so it is one click away when you need it.
#
# Trigger it two ways:
#   * Actions tab → "Release (Android APK)" → Run workflow
#   * push a tag:  git tag v1.0.1 && git push origin v1.0.1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ─── Resolve version + release tag once, share with all jobs ──────
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version + tag
        id: v
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          name=$(echo "$version" | cut -d+ -f1)
          build=$(echo "$version" | cut -d+ -f2)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v${name}-r${{ github.run_number }}"
          fi
          echo "name=${name}"   >> $GITHUB_OUTPUT
          echo "build=${build}" >> $GITHUB_OUTPUT
          echo "tag=${tag}"     >> $GITHUB_OUTPUT
          echo "Release ${tag} (app v${name}, build ${build})"

  # ─── Android — APK (+ AAB) ────────────────────────────────────────
  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.4', channel: 'stable', cache: true }
      - run: flutter pub get

      - name: Decode keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Create key.properties (if configured)
        if: steps.keystore.outputs.configured == 'true'
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # The bundle carries the native debug symbols Play wants, so it
      # is the only build that asks for them. The APK build leaves
      # BILLZAP_PLAY_SYMBOLS unset and ships stripped libraries — see
      # android/app/build.gradle.kts for what that is worth in MB.
      - name: Build App Bundle (with Play symbols)
        env:
          BILLZAP_PLAY_SYMBOLS: '1'
        run: flutter build appbundle --release

      - run: flutter build apk --release

      - name: Refuse to ship an unstripped APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BYTES=$(stat -c%s "$APK")
          MB=$(( BYTES / 1000000 ))
          echo "Universal APK: ${MB} MB (${BYTES} bytes)"
          # A stripped universal build is under 30 MB. 45 leaves room
          # to grow and still catches symbols coming back.
          if [ "$BYTES" -gt 45000000 ]; then
            echo "::error::APK is ${MB} MB — the unstripped build."
            echo "Native debug symbols are in the APK. BILLZAP_PLAY_SYMBOLS"
            echo "must be set for the appbundle step only — see"
            echo "ndk.debugSymbolLevel in android/app/build.gradle.kts."
            exit 1
          fi
          echo "APK_MB=${MB}" >> $GITHUB_ENV

      - name: Stage Android files
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/BillZap-${{ needs.version.outputs.name }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "out/BillZap-${{ needs.version.outputs.name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*

  # ─── Publish the GitHub Release ───────────────────────────────────
  release:
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Give the APK a STABLE name
        # Version-less filename so the landing page can link to
        # github.com/.../releases/latest/download/BillZap-Android.apk
        # and never break when the app version bumps.
        run: |
          mkdir -p release
          find dist -name "*.apk" -exec cp {} release/BillZap-Android.apk \;
          test -f release/BillZap-Android.apk || {
            echo "::error::no APK was produced"; exit 1; }
          ls -lah release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: BillZap ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.build }})
          body: |
            ## BillZap ${{ needs.version.outputs.name }} — build ${{ needs.version.outputs.build }}

            **[Download BillZap-Android.apk](https://github.com/dakshu007/billzap/releases/latest/download/BillZap-Android.apk)** — Android 7.0 and above.

            Tap the file on your phone to install. Android will ask you to
            allow installs from this source the first time; that is normal
            for an app installed outside the Play Store.

            The filename never changes, so the link above always points at
            the newest build.

            Free forever. Works fully offline — no account, no sign-up, no
            subscription, no limit on invoices.
          files: release/BillZap-Android.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
