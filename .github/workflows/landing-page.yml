name: Deploy landing page

# The landing page is a static folder — there is nothing to compile, so
# this workflow rebuilds index.html from build/ (to prove the generated
# file in the repo matches its sources) and then publishes.
#
# It exists because the agent sandbox that authored the site has no
# egress to Netlify; CI does. It is also just a better place for a
# deploy to live than somebody's laptop.
#
# Needs one repository secret:
#   NETLIFY_AUTH_TOKEN — a personal access token from
#   https://app.netlify.com/user/applications#personal-access-tokens
#
# The site ID is not a secret; it is in the URL of the Netlify project.

on:
  push:
    branches: ['**']
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Publish to the live URL (otherwise a preview)'
        type: boolean
        default: true

env:
  NETLIFY_SITE_ID: 2ae758e6-68ec-49e7-8364-6237a893b4c4

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if:` — it
    # resolves to empty there, so a `secrets.X != ''` guard is always
    # false and the deploy silently skips. `env` is available, and a
    # job-level `env:` may read `secrets`, so the presence check is
    # hoisted here.
    env:
      HAS_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the font subsetter
        run: pip install --quiet fonttools brotli

      - name: Rebuild index.html from source
        working-directory: landing-page/build
        run: python3 build.py

      # index.html and the subset fonts are generated and committed. If
      # the rebuild changes them, the committed copy was stale — fail
      # loudly rather than deploying something nobody reviewed.
      - name: Check the committed build is current
        run: |
          if ! git diff --quiet -- landing-page; then
            echo "::error::landing-page/index.html is out of date with build/."
            echo "Run 'cd landing-page/build && python3 build.py' and commit the result."
            git diff --stat -- landing-page
            exit 1
          fi
          echo "Committed build matches its sources."

      # Run from landing-page/, not the repo root. The CLI reads
      # netlify.toml from its working directory, and ours lives beside
      # the files it describes — from the root it finds nothing and the
      # deploy silently ships with no redirects, no cache headers and no
      # CSP. The step prints the rule counts Netlify reports back so a
      # silent drop is visible in the log rather than in production.
      #
      # --no-build because this is a folder of finished files; letting
      # the CLI hunt for a build command in a Flutter repo can only go
      # wrong. CI=true keeps it non-interactive, so a prompt fails the
      # step instead of hanging the runner until the job times out.
      # `netlify deploy --dir=X` publishes everything in X. Pointed at
      # landing-page/ that meant the page templates, the build script
      # and the Apps Script source all went live — and /build/page.html
      # and /build/privacy.html are head-less HTML fragments a crawler
      # can index as thin duplicates of the real pages, which is a
      # direct tax on the SEO the rest of this is for.
      #
      # So the deploy gets an explicit list instead of a directory:
      # anything not named here does not reach the internet. netlify.toml
      # comes along because the CLI reads config from its working
      # directory, which is now this staging folder.
      - name: Stage exactly what the site serves
        working-directory: landing-page
        run: |
          rm -rf dist && mkdir -p dist
          for item in index.html privacy assets llms.txt llms-full.txt \
                      robots.txt sitemap.xml site.webmanifest netlify.toml; do
            [ -e "$item" ] || { echo "::error::missing $item"; exit 1; }
            cp -r "$item" dist/
          done
          echo "Publishing:"
          find dist -type f | sort | sed 's/^/  /'

      - name: Deploy to Netlify
        if: env.HAS_TOKEN == 'true'
        working-directory: landing-page/dist
        timeout-minutes: 12
        env:
          CI: 'true'
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PROD: ${{ github.event_name != 'workflow_dispatch' || inputs.production }}
        run: |
          ARGS="--dir=. --no-build --site=$NETLIFY_SITE_ID --message=${GITHUB_SHA::7}"
          if [ "$PROD" = "true" ]; then ARGS="$ARGS --prod"; fi
          npx -y netlify-cli@latest deploy $ARGS < /dev/null

      - name: Explain a missing token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::NETLIFY_AUTH_TOKEN is not set, so nothing was deployed."
          echo "Add it under Settings -> Secrets and variables -> Actions."
          echo "Create the token at:"
          echo "  https://app.netlify.com/user/applications#personal-access-tokens"
