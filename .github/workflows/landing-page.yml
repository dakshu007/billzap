name: Deploy landing page

# The landing page runs on Cloudflare: a Worker with static assets,
# serving billzap.app. This workflow rebuilds index.html from build/
# (to prove the generated file in the repo matches its sources), stages
# exactly the files the site serves, and deploys with wrangler.
#
# It exists because the agent sandbox that authored the site has no
# egress to Cloudflare; CI does.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token from
#                          https://dash.cloudflare.com/profile/api-tokens
#                          made from the "Edit Cloudflare Workers"
#                          template, with Zone Resources including
#                          billzap.app.
#   CLOUDFLARE_ACCOUNT_ID  the account ID (Workers & Pages overview,
#                          right-hand column). Optional when the token
#                          can see only one account.
#
# The deploy itself creates billzap.app and www.billzap.app as Custom
# Domains on the Worker — DNS records and certificates included (see
# wrangler.jsonc). There is nothing to set up by hand in DNS.
#
# The blog and studio need four Worker secrets: DATABASE_URL,
# ADMIN_PATH, ADMIN_PASSWORD, SESSION_SECRET. A repository secret of
# the same name always wins. Otherwise, the first time a secret is
# missing from the Worker it is copied from the old Netlify site's
# environment, using NETLIFY_AUTH_TOKEN if that secret still exists.

on:
  push:
    branches: ['**']
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Publish to the live URL (otherwise upload a version without deploying it)'
        type: boolean
        default: true

env:
  # Only used to copy the old environment across; see above.
  NETLIFY_SITE_ID: 2ae758e6-68ec-49e7-8364-6237a893b4c4

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if:` — it
    # resolves to empty there, so a `secrets.X != ''` guard is always
    # false and the deploy silently skips. `env` is available, and a
    # job-level `env:` may read `secrets`, so the presence check is
    # hoisted here.
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the font subsetter
        run: pip install --quiet fonttools brotli

      - name: Rebuild index.html from source
        working-directory: landing-page/build
        run: python3 build.py

      # index.html and the subset fonts are generated and committed. If
      # the rebuild changes them, the committed copy was stale — fail
      # loudly rather than deploying something nobody reviewed.
      - name: Check the committed build is current
        run: |
          if ! git diff --quiet -- landing-page; then
            echo "::error::landing-page/index.html is out of date with build/."
            echo "Run 'cd landing-page/build && python3 build.py' and commit the result."
            git diff --stat -- landing-page
            exit 1
          fi
          echo "Committed build matches its sources."

      # The asset directory is published whole, so the deploy gets an
      # explicit list instead: anything not named here does not reach
      # the internet. Earlier, publishing all of landing-page/ put the
      # page templates, the build script and the Apps Script source
      # live, and /build/page.html is a head-less fragment a crawler
      # can index as a thin duplicate of the real page.
      #
      # worker.js, wrangler.jsonc and functions/ are deliberately NOT in
      # this list: wrangler bundles the code from the working directory,
      # and none of it should be fetchable as a file.
      - name: Stage exactly what the site serves
        working-directory: landing-page
        run: |
          rm -rf dist && mkdir -p dist
          for item in index.html privacy assets llms.txt llms-full.txt \
                      robots.txt sitemap.xml site.webmanifest _headers; do
            [ -e "$item" ] || { echo "::error::missing $item"; exit 1; }
            cp -r "$item" dist/
          done
          echo "Publishing:"
          find dist -type f | sort | sed 's/^/  /'

      # wrangler (pinned in package-lock.json) and the Neon driver the
      # handlers import; wrangler bundles the Worker with it.
      - name: Install dependencies
        working-directory: landing-page
        run: npm ci --no-audit --no-fund

      # The account ID secret is easy to paste with a stray space, a
      # newline or the rest of the dashboard URL around it. Take the
      # 32-character ID out of whatever is there; if there is none,
      # leave it unset and wrangler finds the token's only account.
      - name: Normalise the Cloudflare account ID
        if: env.HAS_TOKEN == 'true'
        env:
          RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(printf '%s' "$RAW" | grep -oiE '[0-9a-f]{32}' | head -1 || true)
          if [ -n "$id" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
            echo "Using the account ID from CLOUDFLARE_ACCOUNT_ID."
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID has no 32-character ID in it; letting wrangler detect the account."
          fi

      # Values never touch the log or the repo: each is masked, written
      # to a file outside the checkout, passed to the deploy, deleted.
      - name: Collect the Worker's secrets
        if: env.HAS_TOKEN == 'true'
        working-directory: landing-page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          GH_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          # Secrets the Worker already has. Empty on the very first
          # deploy, when the Worker does not exist yet.
          npx wrangler secret list --format json > "$RUNNER_TEMP/have.json" 2>/dev/null \
            || echo '[]' > "$RUNNER_TEMP/have.json"
          python3 - <<'PY'
          import json, os, urllib.request

          NAMES = ['DATABASE_URL', 'ADMIN_PATH', 'ADMIN_PASSWORD', 'SESSION_SECRET']
          tmp = os.environ['RUNNER_TEMP']
          try:
              have = {s['name'] for s in json.load(open(f'{tmp}/have.json'))}
          except Exception:
              have = set()

          def netlify(path):
              req = urllib.request.Request(
                  'https://api.netlify.com/api/v1' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['NETLIFY_AUTH_TOKEN']})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          old = {}
          if os.environ.get('NETLIFY_AUTH_TOKEN') and not have.issuperset(NAMES):
              try:
                  site = os.environ['NETLIFY_SITE_ID']
                  account = netlify(f'/sites/{site}')['account_id']
                  for var in netlify(f'/accounts/{account}/env?site_id={site}'):
                      vals = {v.get('context'): v.get('value') for v in var.get('values', [])}
                      val = vals.get('production') or vals.get('all')
                      if var.get('key') in NAMES and val:
                          old[var['key']] = val
              except Exception as e:
                  print(f'::warning::Could not read the Netlify environment: {e}')

          out = {}
          for name in NAMES:
              gh = os.environ.get('GH_' + name, '')
              if gh:
                  out[name] = gh; src = 'repository secret'
              elif name in have:
                  src = 'already set on the Worker'
              elif name in old:
                  out[name] = old[name]; src = 'copied from Netlify'
              else:
                  src = 'MISSING'
                  print(f'::warning::{name} is not set: the blog/studio will not work until it is.')
              print(f'  {name:15} {src}')
          for v in out.values():
              print(f'::add-mask::{v}')
          json.dump(out, open(f'{tmp}/secrets.json', 'w'))
          PY

      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        working-directory: landing-page
        timeout-minutes: 12
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROD: ${{ github.event_name != 'workflow_dispatch' || inputs.production }}
        run: |
          if [ "$PROD" = "true" ]; then
            npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" \
              --message "${GITHUB_SHA::7}"
          else
            npx wrangler versions upload --secrets-file "$RUNNER_TEMP/secrets.json" \
              --message "${GITHUB_SHA::7}"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"

      # Verify what was just deployed, from outside, against the real
      # database. Nothing here needs a secret: every assertion is what
      # an anonymous visitor sees. It runs only when a deploy actually
      # happened, so a token-less run does not fail on a stale site.
      - name: Check the live site
        if: env.HAS_TOKEN == 'true' && (github.event_name != 'workflow_dispatch' || inputs.production)
        env:
          SITE: https://billzap.app
        run: |
          fail=0
          check() {                       # name, expected, actual
            if [ "$2" = "$3" ]; then printf '  ok    %-44s %s\n' "$1" "$3"
            else printf '  FAIL  %-44s got %s, wanted %s\n' "$1" "$3" "$2"; fail=1; fi
          }
          code() { curl -s -o /tmp/body -w '%{http_code}' --max-time 45 "$@"; }

          # A new custom domain can take a minute or two for its
          # certificate; wait for it rather than failing the first run.
          for i in $(seq 1 30); do
            [ "$(code $SITE/)" = 200 ] && break
            echo "  waiting for $SITE ($i)"; sleep 10
          done

          echo "── one hostname ──"
          check "GET www (301 to apex)" 301 "$(code https://www.billzap.app/privacy/)"

          echo "── pages ──"
          check "GET /"                200 "$(code $SITE/)"
          check "GET /privacy/"        200 "$(code $SITE/privacy/)"
          check "GET Search Console file" 200 "$(code $SITE/googled23738155d4d0020.html)"
          grep -q 'google-site-verification: googled23738155d4d0020.html' /tmp/body \
            && echo "  ok    Search Console file content" \
            || { echo "  FAIL  Search Console file content"; fail=1; }
          check "GET /blog"            200 "$(code $SITE/blog)"
          grep -q 'Running a shop' /tmp/body \
            && echo "  ok    /blog rendered from the database" \
            || { echo "  FAIL  /blog did not render"
                 grep -o '<!-- diag:[^>]*-->' /tmp/body || echo "  (no diagnostic in the body)"
                 grep -o '<!-- env:[^>]*-->' /tmp/body || true
                 fail=1; }

          echo "── blog extras ──"
          check "GET /sitemap-blog.xml" 200 "$(code $SITE/sitemap-blog.xml)"
          grep -q '<urlset' /tmp/body && echo "  ok    sitemap is xml" || { echo "  FAIL  sitemap"; fail=1; }
          check "GET /blog/feed.xml"    200 "$(code $SITE/blog/feed.xml)"
          check "GET /blog/no-such-post" 404 "$(code $SITE/blog/no-such-post)"

          # Both of these shipped broken and the smoke test said "all
          # checks passed", because a page that renders is not the same
          # as a page whose images load. A 200 on /blog proves neither.
          echo "── blog images ──"
          # The header is shared with the static pages, which are written
          # with relative asset paths. A relative path is wrong here:
          # /blog/<slug> is one level deep and "assets/…" 404s there.
          code $SITE/blog >/dev/null
          if grep -qo 'src="assets/' /tmp/body; then
            echo "  FAIL  relative asset path in the blog header"; fail=1
          else
            echo "  ok    blog asset paths are root-absolute"
          fi
          # Post images are rows in the database served by the function.
          # Take one the live page actually asks for and fetch it.
          MEDIA=$(grep -o '/media/[0-9]*' /tmp/body | head -1)
          if [ -n "$MEDIA" ]; then
            mt=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 45 "$SITE$MEDIA")
            case "$mt" in
              "200 image/"*) printf '  ok    GET %-40s %s\n' "$MEDIA" "$mt" ;;
              *) printf '  FAIL  GET %-40s got %s\n' "$MEDIA" "$mt"; fail=1 ;;
            esac
          else
            echo "  --    no post image on /blog to check"
          fi
          check "GET /media/999999"    404 "$(code $SITE/media/999999)"

          echo "── the studio must not be findable ──"
          check "GET /s/admin"         404 "$(code $SITE/s/admin)"
          check "GET /s/"              404 "$(code $SITE/s/)"
          check "GET /s/studio"        404 "$(code $SITE/s/studio)"

          echo "── auth ──"
          # Note: a wrong password is refused whether or not
          # ADMIN_PASSWORD is set, so this proves the route exists and
          # is closed — not that the environment is configured. The
          # env line printed above /blog's failure is what shows that.
          check "POST /api/login (wrong password)" 401 \
            "$(code -X POST -H 'Content-Type: application/json' -d '{"password":"nope"}' $SITE/api/login)"
          check "GET /api/posts (no session)"      401 "$(code $SITE/api/posts)"

          echo "── nothing that should not be served ──"
          check "GET /wrangler.jsonc"  404 "$(code $SITE/wrangler.jsonc)"
          check "GET /worker.js"       404 "$(code $SITE/worker.js)"
          check "GET /build/page.html" 301 "$(code $SITE/build/page.html)"
          check "GET /package.json"    404 "$(code $SITE/package.json)"

          # Cloudflare can block AI crawlers, or rewrite robots.txt, from
          # the dashboard, without touching this repo. Either would undo
          # the whole point of llms.txt and the robots.txt allow-list, so
          # the deploy says so. A warning, not a failure: it is an account
          # setting, and a code change cannot fix it.
          echo "── AI crawlers ──"
          served=$(curl -s --max-time 30 $SITE/robots.txt)
          if [ "$served" = "$(cat landing-page/robots.txt)" ]; then
            echo "  ok    robots.txt is ours, unmodified"
          else
            echo "::warning::The live robots.txt differs from landing-page/robots.txt. Cloudflare's managed robots.txt or AI Crawl Control is probably rewriting it: Cloudflare dashboard -> billzap.app -> AI Crawl Control / Security -> Bots, allow AI crawlers."
            diff <(echo "$served") landing-page/robots.txt | head -20 || true
          fi
          for ua in GPTBot OAI-SearchBot PerplexityBot ClaudeBot; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -A "Mozilla/5.0 (compatible; $ua/1.0)" $SITE/llms.txt)
            if [ "$c" = 200 ]; then printf '  ok    %-44s %s\n' "$ua can fetch /llms.txt" "$c"
            else echo "::warning::$ua got $c for /llms.txt — check Cloudflare's AI bot blocking for billzap.app."; fi
          done

          echo "── headers ──"
          hdr=$(curl -sI --max-time 45 $SITE/blog)
          echo "$hdr" | grep -qi 'content-security-policy' \
            && echo "  ok    CSP present on /blog" || { echo "  FAIL  no CSP on /blog"; fail=1; }

          echo
          [ $fail -eq 0 ] && echo "All checks passed." || { echo "Some checks failed."; exit 1; }

      - name: Explain a missing token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
          echo "Add it (and CLOUDFLARE_ACCOUNT_ID) under Settings -> Secrets and variables -> Actions."
          echo "Create the token at https://dash.cloudflare.com/profile/api-tokens"
          echo "from the 'Edit Cloudflare Workers' template, with billzap.app in Zone Resources."

  # The browser test, against the site that was just deployed: download
  # buttons, links, sideways scroll, JS errors and every motion stage
  # sampled through its film at five sizes. A separate job, so the
  # deploy itself is not held up by it; a failure here shows red on the
  # commit with the list of what failed and where.
  browser-test:
    needs: deploy
    if: github.event_name != 'workflow_dispatch' || inputs.production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: landing-page
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: landing-page
        run: npx playwright install --with-deps chromium
      - name: Test the live site
        working-directory: landing-page
        run: node tests/site-check.mjs https://billzap.app
