name: Build Android (AAB + APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'pubspec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Auto-bump version build number
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          name=$(echo "$current" | cut -d+ -f1)
          build=$(echo "$current" | cut -d+ -f2)
          new_build=$((build + 1))
          new_version="${name}+${new_build}"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          echo "version=${new_version}" >> $GITHUB_OUTPUT
          echo "build=${new_build}" >> $GITHUB_OUTPUT
          echo "Bumped to: ${new_version}"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore (if secrets configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded — release build will be signed"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "No keystore — building debug-signed (not Play Store uploadable)"
          fi

      - name: Create key.properties (if keystore configured)
        if: steps.keystore.outputs.configured == 'true'
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Symbols go to Play via the bundle. The APK steps below leave
      # BILLZAP_PLAY_SYMBOLS unset so they ship stripped native
      # libraries — it is the difference between a 25 MB arm64 APK and
      # a ~9 MB one. See android/app/build.gradle.kts.
      - name: Build App Bundle (AAB, with Play symbols)
        env:
          BILLZAP_PLAY_SYMBOLS: '1'
        run: flutter build appbundle --release

      # Universal APK — installs on any device, no guessing which one to
      # download. This is the link we hand people for sideloading.
      - name: Build APK (universal)
        run: flutter build apk --release

      # Per-ABI APKs. A universal APK carries native libraries for every
      # architecture, so roughly two thirds of it is dead weight on any
      # given phone. arm64-v8a covers essentially every Android device
      # sold in the last several years and is a third of the size, which
      # matters a lot for this app's users.
      - name: Build APKs (per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Report artifact sizes
        run: |
          echo "### Build sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/bundle/release/*.aab \
                 build/app/outputs/flutter-apk/*.apk \
            | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-v${{ steps.bump.outputs.build }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-v${{ steps.bump.outputs.build }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-arm64-v${{ steps.bump.outputs.build }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # The artifacts are already built and uploaded by this point, so a
      # failure here must not fail the run. It races with anyone pushing
      # during the ~6 minutes the build takes: the bump commit is then
      # non-fast-forward and the push is rejected, which used to mark a
      # perfectly good build red. Rebase onto whatever landed, retry a
      # few times, and give up quietly rather than lose the build.
      - name: Commit version bump
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "ci: bump build to ${{ steps.bump.outputs.build }} [skip ci]" \
            || { echo "Nothing to commit"; exit 0; }
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed version bump on attempt $attempt"
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/$GITHUB_REF_NAME and retrying"
            git pull --rebase origin "$GITHUB_REF_NAME" || break
            sleep $((attempt * 3))
          done
          echo "::warning::Could not push the version bump. The build artifacts above are unaffected."
          exit 0
