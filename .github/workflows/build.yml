name: Build Android (AAB + APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'pubspec.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Auto-bump version build number
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          name=$(echo "$current" | cut -d+ -f1)
          build=$(echo "$current" | cut -d+ -f2)
          new_build=$((build + 1))
          new_version="${name}+${new_build}"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          echo "version=${new_version}" >> $GITHUB_OUTPUT
          echo "build=${new_build}" >> $GITHUB_OUTPUT
          echo "Bumped to: ${new_version}"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore (if secrets configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded — release build will be signed"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "No keystore — building debug-signed (not Play Store uploadable)"
          fi

      - name: Create key.properties (if keystore configured)
        if: steps.keystore.outputs.configured == 'true'
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build APK
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-v${{ steps.bump.outputs.build }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-v${{ steps.bump.outputs.build }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Commit version bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "ci: bump build to ${{ steps.bump.outputs.build }} [skip ci]" || echo "Nothing to commit"
          git push
