name: billzap
description: BillZap - Free GST Billing for Indian MSMEs. 100% Offline.
publish_to: 'none'
version: 1.0.0+260502270

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  google_fonts: ^8.2.1
  gap: ^3.0.1
  cupertino_icons: ^1.0.8
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  crypto: ^3.0.7
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  lucide_icons_flutter: ^3.1.20
  qr_flutter: ^4.1.0
  speech_to_text: ^7.5.0
  barcode: ^2.2.9

flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    # The mark without its jade tile — used on the splash, where the
    # tile's own ground would vanish into the screen behind it.
    - assets/icon_foreground.png
    # Embedded in the generated invoice PDF. The PDF spec's built-in
    # fonts are Latin-1 only and have no rupee glyph, which is why the
    # old invoices printed "Rs." — a detail that makes a bill look
    # amateur. Inter carries U+20B9 and has tabular figures, so money
    # columns line up in print too. SIL Open Font License.
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-SemiBold.ttf

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#10A56F"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: false
  min_sdk_android: 24
