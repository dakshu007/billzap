name: billzap
description: BillZap - Free GST Billing for Indian MSMEs. 100% Offline.
publish_to: 'none'
version: 1.0.0+260502267

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  google_fonts: ^8.2.1
  gap: ^3.0.1
  cupertino_icons: ^1.0.8
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  intl: ^0.20.3
  crypto: ^3.0.7
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  lucide_icons_flutter: ^3.1.20
  qr_flutter: ^4.1.0
  speech_to_text: ^7.5.0
  barcode: ^2.2.9

flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1557FF"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: false
  min_sdk_android: 24
